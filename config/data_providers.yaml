# 数据提供者配置文件

# 数据提供者列表
providers:
  astock_skill:
    enabled: true
    priority: 100
    description: "A股数据SKILL - 提供个股新闻/行情/研报/基本面"
    capabilities:
      - news
      - quote
      - research
      - fundamentals
    config:
      timeout: 5
      retry: 3

  rss:
    enabled: true
    priority: 60
    description: "RSS新闻源 - 提供宏观财经新闻（隐式推理用）"
    capabilities:
      - news
    config:
      feeds:
        # 中文财经新闻
        - name: "财新网"
          url: "http://www.caixin.com/rss/rss_finance.xml"
          type: "macro"
        - name: "第一财经"
          url: "https://www.yicai.com/rss/news.xml"
          type: "industry"
        - name: "36氪"
          url: "https://36kr.com/feed"
          type: "tech"
        - name: "虎嗅"
          url: "https://www.huxiu.com/rss/0.xml"
          type: "business"

        # 美股/国际财经新闻
        - name: "Reuters Business"
          url: "https://www.reutersagency.com/feed/?taxonomy=best-topics&post_type=best"
          type: "us_market"
        - name: "MarketWatch"
          url: "https://feeds.marketwatch.com/marketwatch/topstories/"
          type: "us_market"
        - name: "Seeking Alpha"
          url: "https://seekingalpha.com/feed.xml"
          type: "us_market"
        - name: "Yahoo Finance"
          url: "https://finance.yahoo.com/news/rssindex"
          type: "us_market"
        - name: "CNBC"
          url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
          type: "us_market"

  akshare:
    enabled: false  # Python 3.14 不兼容，暂时禁用
    priority: 80
    description: "AKShare - A股数据接口"
    capabilities:
      - news

# 各模块的数据源偏好配置
modules:
  # M0 采集器
  m0_collector:
    news:
      providers: ['astock_skill', 'rss']  # 聚合多源
      aggregate: true  # 合并去重
      limit: 50

  # M2 情绪分析
  m2_sentiment:
    quote:
      provider: 'astock_skill'  # 优先使用 SKILL
      fallback: []  # 暂无备用

  # M3 机会判断
  m3_opportunity:
    fundamentals:
      provider: 'astock_skill'
    research:
      provider: 'astock_skill'
      limit: 5
    quote:
      provider: 'astock_skill'

# 健康检查配置
health_check:
  enabled: true
  interval: 300  # 检查间隔（秒）
  test_symbols:
    - "000001"  # 平安银行
    - "600000"  # 浦发银行
