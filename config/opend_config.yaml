opend:
  data_priority:
  - futu_feed
  - yfinance_feed
  - akshare_feed
  executable:
    darwin: /Applications/FutuOpenD.app/Contents/MacOS/FutuOpenD
    linux: /root/futu/Futu_OpenD_10.4.6408_Ubuntu18.04/Futu_OpenD_10.4.6408_Ubuntu18.04/FutuOpenD
    windows: D:\2_Tools\Futu_OpenD_10.4.6408_Windows\Futu_OpenD_10.4.6408_Windows/FutuOpenD.exe
  host: 127.0.0.1
  markets:
    A_SHARE:
      enabled: true
      latency: 秒级实时
    HK:
      enabled: true
      latency: 秒级实时
    US:
      enabled: true
      latency: 15分钟延迟（免费版）
      notes: 需要富途牛牛APP扫码授权
  port: 11111
  process:
    check_command: pgrep -f FutuOpenD
    log_file: logs/opend.log
    pid_file: logs/opend.pid
  startup:
    auto_start: true
    check_interval: 2
    max_retries: 3
    wait_seconds: 5
